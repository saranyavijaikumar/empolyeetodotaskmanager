<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📝 To-Do Task Manager</h1>
        <p class="subtitle">Manage your daily tasks easily</p>

        <div class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button onclick="addTask()">Add Task</button>
        </div>

        <div class="filter-section">
            <button onclick="showTasks('all')">All</button>
            <button onclick="showTasks('pending')">Pending</button>
            <button onclick="showTasks('completed')">Completed</button>
        </div>

        <div class="task-info">
            <span>Total: <b id="totalTasks">0</b></span>
            <span>Pending: <b id="pendingTasks">0</b></span>
            <span>Completed: <b id="completedTasks">0</b></span>
        </div>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
